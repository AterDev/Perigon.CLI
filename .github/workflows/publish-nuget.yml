name: Publish Perigon.CLI

on:
  push:
    branches:
      - nuget
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify PowerShell Core
        shell: bash
        run: pwsh --version

      - name: Read package metadata
        id: package
        shell: pwsh
        run: |
          $projectPath = 'src/Apps/CommandLine/CommandLine.csproj'
          $packageId = (Select-Xml -Path $projectPath -XPath '/Project//PackageId').Node.InnerText
          $version = (Select-Xml -Path $projectPath -XPath '/Project//Version').Node.InnerText

          if ([string]::IsNullOrWhiteSpace($packageId) -or [string]::IsNullOrWhiteSpace($version)) {
              throw "PackageId or Version is missing from $projectPath."
          }

          $packagePath = "artifacts/$packageId.$version.nupkg"
          "package_id=$packageId" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Build and pack CLI
        shell: pwsh
        run: |
          & './scripts/PublishToLocal.ps1'
          if ($LASTEXITCODE -ne 0) {
              throw "PublishToLocal.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Validate package contents
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_PATH
          if (-not (Test-Path -LiteralPath $packagePath)) {
              throw "Package was not created: $packagePath"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
              if (-not ($archive.Entries | Where-Object { $_.FullName -match '^tools/.+/agent\.zip$' })) {
                  throw 'The NuGet package does not contain the agent init resources.'
              }
              if ($null -eq $archive.GetEntry('tools/net11.0/any/DotnetToolSettings.xml')) {
                  throw 'The package does not contain the portable .NET 11 tool manifest.'
              }
              if ($null -eq $archive.GetEntry('tools/net11.0/any/BuildHost-netcore/Microsoft.CodeAnalysis.Workspaces.MSBuild.BuildHost.dll')) {
                  throw 'The .NET SDK build host is missing from the tool package.'
              }
              if ($archive.Entries.FullName -match '/BuildHost-net472/|\.pdb$') {
                  throw 'The package contains the legacy MSBuild host or debug symbols.'
              }

              $nuspecEntry = $archive.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
              if ($null -eq $nuspecEntry) {
                  throw 'The NuGet package does not contain a .nuspec file.'
              }

              $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
              try {
                  [xml]$nuspec = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }

              if ([string]$nuspec.package.metadata.version -ne $env:PACKAGE_VERSION) {
                  throw "Package version does not match $env:PACKAGE_VERSION."
              }
          }
          finally {
              $archive.Dispose()
          }

          Write-Host "Validated package: $packagePath"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perigon.CLI-${{ steps.package.outputs.package_version }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_PATH
          dotnet nuget push $packagePath `
            --api-key $env:NUGET_API_KEY `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate
